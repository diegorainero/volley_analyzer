name: Build

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: "Modalità build"
        required: true
        default: scout
        type: choice
        options:
          - scout
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Set build mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=scout" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libglib2.0-0 libxkbcommon0

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libxkbcommon 2>/dev/null || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p dist

      - name: Build executable
        env:
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          target="linux"
          if [ "$RUNNER_OS" = "Windows" ]; then target="windows"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then target="macos"; fi
          python scripts/build.py --target "$target" --mode "$BUILD_MODE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VolleyballScout-${{ runner.os }}-${{ steps.mode.outputs.mode }}
          path: dist/VolleyballScout*
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
