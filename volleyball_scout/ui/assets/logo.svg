<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e1e1e" stroke="#0066cc" stroke-width="2"/>

  <!-- Volleyball circle (ball) -->
  <circle cx="100" cy="80" r="35" fill="none" stroke="#0066cc" stroke-width="2"/>

  <!-- Volleyball segments -->
  <path d="M 100 45 L 100 115" stroke="#0066cc" stroke-width="1.5"/>
  <path d="M 65 80 L 135 80" stroke="#0066cc" stroke-width="1.5"/>

  <!-- Curved segments for ball texture -->
  <path d="M 75 60 Q 85 55 95 60" stroke="#0066cc" stroke-width="1.5" fill="none"/>
  <path d="M 75 100 Q 85 105 95 100" stroke="#0066cc" stroke-width="1.5" fill="none"/>
  <path d="M 105 60 Q 115 55 125 60" stroke="#0066cc" stroke-width="1.5" fill="none"/>
  <path d="M 105 100 Q 115 105 125 100" stroke="#0066cc" stroke-width="1.5" fill="none"/>

  <!-- Scout binoculars icon below ball -->
  <g transform="translate(100, 125)">
    <!-- Left lens -->
    <circle cx="-12" cy="0" r="8" fill="none" stroke="#0066cc" stroke-width="2"/>
    <circle cx="-12" cy="0" r="5" fill="#0066cc" opacity="0.3"/>

    <!-- Right lens -->
    <circle cx="12" cy="0" r="8" fill="none" stroke="#0066cc" stroke-width="2"/>
    <circle cx="12" cy="0" r="5" fill="#0066cc" opacity="0.3"/>

    <!-- Bridge -->
    <rect x="-6" y="-2" width="12" height="4" fill="#0066cc"/>
  </g>

  <!-- Text -->
  <text x="100" y="175" font-size="11" font-weight="bold" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif">
    VOLLEYBALL SCOUT
  </text>
</svg>
